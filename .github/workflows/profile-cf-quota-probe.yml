name: Profile Cloudflare quota probe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-analytics:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out reviewed default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Cloudflare metrics without publishing
        env:
          PROFILE_CF_QUOTA: ${{ secrets.PROFILE_CF_QUOTA }}
          PROFILE_CF_ANALYTICS_TOKEN: ${{ secrets.PROFILE_CF_ANALYTICS_TOKEN }}
        run: python3 -B scripts/probe_profile_cf_quota.py
